# Builds textier and runs its core tests on every push to main and every pull request.
# The app tests drive real windows and stay a local run (scripts/test.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Core tests
        run: scripts/test.sh --skip TextierAppTests || { tail -80 .build/test.log; exit 1; }

      - name: Build the app
        run: swift build -c release --product Textier
